<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>

    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Page shell ─────────────────────────────────────────────────────── */
    /*
     * The background colour fills any letterbox areas that appear when the
     * image's aspect ratio doesn't match the viewport (e.g. ultrawide screens).
     * Light → Eggshell  |  Dark → Prussian Blue
     */
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #F1E9DA; /* Eggshell — ITERATE: change to any brand colour */
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #133552; } /* Prussian Blue — ITERATE */
    }

    /* ── Background image layer ─────────────────────────────────────────── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;     /* vertical centre */
      justify-content: center; /* horizontal centre */
    }

    .bg img {
      /*
       * SIZING RULES — read all three before changing anything:
       *
       * 1. width / height = 100vw / 100vh
       *    The <img> element stretches to fill the viewport so CSS has a
       *    container to work within.
       *
       * 2. object-fit: contain
       *    Scales the image DOWN proportionally so it is always fully
       *    visible (no cropping). If the viewport is taller or wider than
       *    the image's ratio, the remaining space shows the body background.
       *    object-position: center keeps it centred in both axes.
       *
       * 3. max-width / max-height = original image dimensions
       *    Prevents the image from ever being upscaled beyond its native
       *    pixels. On a viewport larger than 3840×2160, the image stays at
       *    3840×2160 and the letterbox area grows.
       *
       * ─── If you swap the image, update max-width / max-height to match
       *     the new file's natural dimensions. ───────────────────────────
       */
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      max-width:  3840px; /* natural width  of naruto-swift.png — UPDATE if image changes */
      max-height: 2160px; /* natural height of naruto-swift.png — UPDATE if image changes */
    }

    /* ── Foreground content ─────────────────────────────────────────────── */
    .content {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      /* Safety padding so the search bar never touches the window edges */
      padding: 24px;
    }

    /* ── Search bar ─────────────────────────────────────────────────────── */
    .search-form {
      width: 100%;
      max-width: 560px; /* ITERATE: widen / narrow the bar */
    }

    .search-input {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 28px;
      font-size: 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      outline: none;
      transition: box-shadow 0.15s ease, background 0.15s ease;

      /* Light mode — warm-white pill on top of image */
      background: rgba(255, 252, 247, 0.88); /* near-white, slightly transparent */
      color: #133552;                         /* Prussian Blue text */
      caret-color: #ED6733;                   /* Giants Orange cursor */
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.28);
    }
    .search-input::placeholder {
      color: rgba(19, 53, 82, 0.42); /* ITERATE: increase opacity for higher contrast */
    }
    .search-input:focus {
      background: rgba(255, 252, 247, 0.97);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.38);
    }

    /* Dark mode — navy pill */
    @media (prefers-color-scheme: dark) {
      .search-input {
        background: rgba(18, 44, 68, 0.88); /* dark navy, slightly transparent */
        color: #F1E9DA;                       /* Eggshell text */
        caret-color: #ED6733;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
      }
      .search-input::placeholder {
        color: rgba(241, 233, 218, 0.38); /* ITERATE */
      }
      .search-input:focus {
        background: rgba(18, 44, 68, 0.97);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.65);
      }
    }

  </style>
</head>
<body>

  <!-- Background image: always fully visible, never upscaled beyond 4K -->
  <div class="bg">
    <img src="images/naruto-swift.png" alt="">
  </div>

  <!-- Foreground: centred Google search bar -->
  <div class="content">
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input
        class="search-input"
        type="text"
        name="q"
        placeholder="Search Google or type a URL"
        autofocus
        autocomplete="off"
        spellcheck="false"
      >
    </form>
  </div>

</body>
</html>
